# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # Spring AI 配置
  # 说明：OpenRouter 提供 OpenAI 兼容协议，因此复用 Spring AI 官方的 OpenAI starter，
  #      只把 base-url 和 model 换成 OpenRouter 的即可，Java 代码不需要改动。
  # 模型选用 openrouter/free：免费路由模型，由 OpenRouter 自动挑选当前可用的免费模型，
  #      无需绑定付费方式，适合课程演示；代价是被路由到的模型不固定，输出质量略有波动，
  #      所以业务层不依赖模型自评的风险等级（见 AiAssessmentServiceImpl 的 judgeRiskLevel），
  #      并且把每次实际使用的模型名记入 model_name 字段，结果可追溯。
  # 密钥从环境变量 OPENROUTER_API_KEY 读取（不内置任何密钥）。
  #      获取方式：https://openrouter.ai 注册后在 Keys 页创建，免费模型无需付费。
  #      设置方式见根目录《使用说明.md》；未设置时 AI 评估功能不可用，其余功能不受影响。
  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY:}
      # 注意：Spring AI 2.x 底层用的是官方 openai-java SDK，SDK 只会追加 /chat/completions，
      #      所以 base-url 必须写到 /v1 这一层，最终请求 https://openrouter.ai/api/v1/chat/completions
      #      （写成 https://openrouter.ai/api 会 404 —— 这类问题只有实际调一次才会暴露）
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          model: openrouter/free
          # 健康解读需要稳定、少发散，温度取低值
          temperature: 0.3
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
